name: Android widget

# The STSD repo has no build step — it is static files served by Pages. This
# builds the one thing in it that does need a toolchain, so nobody has to
# install Android Studio to get an APK.
#
# A push to main republishes the SAME release tag, so the download URL never
# changes and never expires:
#
#   https://github.com/Stonedragonstrength/STSD/releases/latest/download/stone-dragon-schedule.apk
#
# Artifacts alone were not enough: they expire after 90 days, need a GitHub
# login, and live at a different URL per run — which turns "reinstall it" into
# a hunt through Actions history.
on:
  push:
    branches: [main]
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"
  pull_request:
    paths:
      - "android-widget/**"
  workflow_dispatch:

permissions:
  contents: write # publishing the release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed: the wrapper is a binary jar, and this
      # repo is otherwise entirely text. The action supplies Gradle instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Runners generate a throwaway debug keystore per job, so without a
      # committed key every build is signed differently and Android rejects the
      # next one as "update not installed". Generated once and committed back;
      # every later run finds it and skips this.
      - name: Ensure a stable signing key
        working-directory: android-widget
        run: |
          if [ ! -f signing/widget.jks ]; then
            mkdir -p signing
            keytool -genkeypair -v \
              -keystore signing/widget.jks \
              -storepass stonedragon -keypass stonedragon \
              -alias widget -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Stone Dragon Schedule, O=Stone Dragon Strength Training, C=US"
            echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
            echo "Generated a new signing key."
          else
            echo "Signing key already committed."
          fi

      # Committed before the build so a failing build can't strand the key on a
      # runner and mint a different one next time.
      - name: Commit the signing key (first run only)
        if: env.NEW_KEYSTORE == '1' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android-widget/signing/widget.jks
          # [skip ci] or this push retriggers the very workflow that made it.
          git commit -m "Widget signing key, so updates install over each other [skip ci]"
          git push

      - name: Build debug APK
        working-directory: android-widget
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Report the signature
        working-directory: android-widget
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "SHA256:|Owner:" || true

      - name: Lint
        working-directory: android-widget
        run: gradle lintDebug --no-daemon
        continue-on-error: true

      # A stable filename, because the release URL is built from it.
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android-widget/app/build/outputs/apk/debug/app-debug.apk \
             dist/stone-dragon-schedule.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: stone-dragon-schedule-debug
          path: dist/stone-dragon-schedule.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android-widget/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Only from main — a PR build should not overwrite the installable APK.
      - name: Publish to the permanent release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: Stone Dragon Schedule widget (latest)
          body: |
            Android home-screen widget showing the coach's booked sessions,
            one day at a time.

            **Install:** download `stone-dragon-schedule.apk` below, tap it, and
            allow your browser or file manager to install unknown apps. Then open
            **Stone Dragon Schedule** from the app drawer and sign in.

            This release is republished on every build, so this page and its
            download link always point at the newest APK.

            Built from ${{ github.sha }}.
          files: dist/stone-dragon-schedule.apk
          make_latest: true
